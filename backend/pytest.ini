[pytest]
testpaths = tests
pythonpath = .
filterwarnings =
    # Starlette 1.10 recommends `httpx2` for its TestClient. Checked 2026-10-26: httpx2 is
    # the httpx author's successor (github.com/pydantic/httpx2), but its latest release was
    # 5 days old and it adds new dependencies. httpx 0.28.1 (pinned) still works, so this
    # test-only dependency stays on httpx for now; switch when upgrading Starlette.
    ignore:Using `httpx` with `starlette.testclient` is deprecated
